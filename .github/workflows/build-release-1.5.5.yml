name: Construire et publier APK 1.5.5

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/release-trigger-v1.5.5.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurer le chemin des outils Android
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$sdkmanager_bin" ]; then
            echo "::error::sdkmanager introuvable dans le SDK Android"
            exit 1
          fi
          sdkmanager_dir="$(dirname "$sdkmanager_bin")"
          echo "$sdkmanager_dir" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Vérifier les secrets de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS" || {
            echo "Signature absente : configurer les 4 secrets GitHub Actions."
            exit 1
          }
      - name: Préparer et vérifier les sources 1.5.5
        run: |
          set -euo pipefail
          mkdir -p /tmp/mon-evolution-src
          cp -R android/source-1.5.3/. /tmp/mon-evolution-src/
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          python3 android/patches/update-links-v1.5.5.py
          grep -q 'versionName="1.5.5"' /tmp/mon-evolution-src/app/src/main/AndroidManifest.xml
          grep -q 'versionCode 11' /tmp/mon-evolution-src/app/build.gradle
          grep -q 'openOfficialUrl' /tmp/mon-evolution-src/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'update-page-open' /tmp/mon-evolution-src/app/src/main/assets/index.html
          grep -q 'update-direct-open' /tmp/mon-evolution-src/app/src/main/assets/index.html
      - name: Contrôler l'icône de lancement
        run: |
          set -euo pipefail
          SRC=/tmp/mon-evolution-src/app/src/main
          test -f "$SRC/AndroidManifest.xml"
          grep -Fq 'android:icon="@drawable/ic_launcher"' "$SRC/AndroidManifest.xml"
          test -s "$SRC/res/drawable/ic_launcher.xml"
          echo "Icône Android déclarée et présente"
      - name: Compiler le correctif
        working-directory: /tmp/mon-evolution-src
        run: gradle --no-daemon :app:assembleRelease
      - name: Aligner, signer, vérifier APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/mon-evolution-keystore.jks
          mkdir -p downloads
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            /tmp/mon-evolution-src/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/mon-evolution-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/mon-evolution-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEY_PASS \
            --out downloads/Mon_Evolution_IMC_v1.5.5.apk \
            /tmp/mon-evolution-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose downloads/Mon_Evolution_IMC_v1.5.5.apk
          rm -f /tmp/mon-evolution-keystore.jks
      - name: Vérifier le manifeste de l'APK signée
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging downloads/Mon_Evolution_IMC_v1.5.5.apk | grep -E "package:|application-icon"
      - name: Publier l'APK via GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.5.5 downloads/Mon_Evolution_IMC_v1.5.5.apk \
            --title "Mon Évolution IMC v1.5.5" \
            --notes "Deux méthodes de mise à jour intégrées : page GitHub Releases recommandée sur Samsung, et APK direct. Ouverture dans le navigateur externe et mise à jour signée."
      - name: Mettre à jour le site et les métadonnées
        run: |
          set -euo pipefail
          python3 android/patches/publish-v1.5.5.py
          mkdir -p android/source-1.5.5
          cp -R /tmp/mon-evolution-src/. android/source-1.5.5/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.js index.html android/source-1.5.5
          git commit -m "Publier Mon Évolution IMC 1.5.5 avec les deux liens GitHub"
          git push
