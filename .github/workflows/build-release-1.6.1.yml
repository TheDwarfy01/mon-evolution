name: Vérifier et publier Mon Évolution IMC 1.6.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/release-trigger-v1.6.1.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Node et Gradle pour les tests
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Préparer les sources 1.6.1 multi-profils
        run: |
          set -euo pipefail
          mkdir -p android/source-1.6.1
          cp -R android/source-1.6.0/. android/source-1.6.1/
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android/source-1.6.1/app')
          for p in (root/'build.gradle',root/'src/main/AndroidManifest.xml'):
              source=p.read_text(encoding='utf-8')
              assert '1.6.0' in source
              out=source.replace('1.6.0','1.6.1')
              out=out.replace('versionCode 16','versionCode 17')
              out=out.replace('android:versionCode="16"','android:versionCode="17"')
              p.write_text(out,encoding='utf-8')
          PY
          python3 android/patches/patch-received-native-v1.6.1.py
          python3 android/patches/patch-received-ui-v1.6.1.py
          grep -q 'listReceivedProfiles' android/source-1.6.1/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'unified-profile-picker' android/source-1.6.1/app/src/main/assets/index.html
      - name: Tests JavaScript, partage, données et sécurité
        run: |
          set -euo pipefail
          node --version
          python3 android/tests/validate-1.6.1.py
      - name: Installer SDK Android
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_bin"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Vérifier la configuration et l'icône
        run: |
          set -euo pipefail
          grep -q 'versionCode 17' android/source-1.6.1/app/build.gradle
          grep -q 'versionName="1.6.1"' android/source-1.6.1/app/src/main/AndroidManifest.xml
          test -s android/source-1.6.1/app/src/main/res/drawable/ic_launcher.xml
      - name: Compiler 1.6.1
        working-directory: android/source-1.6.1
        run: gradle --no-daemon :app:assembleRelease
      - name: Signer et vérifier l'APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/mon-evolution-1.6.1.jks
          mkdir -p downloads
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            android/source-1.6.1/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/mon-evolution-1.6.1-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/mon-evolution-1.6.1.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEY_PASS \
            --out downloads/Mon_Evolution_IMC_v1.6.1.apk \
            /tmp/mon-evolution-1.6.1-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose downloads/Mon_Evolution_IMC_v1.6.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging downloads/Mon_Evolution_IMC_v1.6.1.apk | grep -E 'package:|application-icon'
          rm -f /tmp/mon-evolution-1.6.1.jks
      - name: Publier dans GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.6.1 >/dev/null 2>&1; then
            gh release upload v1.6.1 downloads/Mon_Evolution_IMC_v1.6.1.apk --clobber
          else
            gh release create v1.6.1 downloads/Mon_Evolution_IMC_v1.6.1.apk \
              --title "Mon Évolution IMC 1.6.1 — stabilisation" \
              --notes "Plusieurs profils partagés et personnels dans un sélecteur unique. Chaque profil reçu garde sa propre source Drive (privée ou lien public). Bascule rapide et retrait local sans effacer les fichiers du propriétaire. Ne pas désinstaller pour conserver les données."
          fi
      - name: Actualiser page GitHub et métadonnées pour les anciennes versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          version=Path("version.js")
          site=Path("index.html")
          expected="1.6.0"
          new="1.6.1"
          for path in (version,site):
              old=path.read_text(encoding="utf-8")
              if new not in old:
                  assert expected in old, f"Version incompatible dans {path}"
                  path.write_text(old.replace(expected,new),encoding="utf-8")
          html=site.read_text(encoding="utf-8")
          newnote=("Version 1.6.1 : sélecteur unique des profils personnels et partagés, "
                   "plusieurs proches indépendants en lecture seule et bascule rapide. "
                   "Retrait du profil reçu sans supprimer le fichier de son propriétaire. "
                   "Téléchargement conseillé : page GitHub Releases.")
          html,n=re.subn(r'<p class="note">Version 1\.6\.0 :.*?</p>',
                         '<p class="note">'+newnote+'</p>',html)
          assert n==1, f"Note du site absente (matches={n})"
          assert "releases/tag/v1.6.1" in html
          site.write_text(html,encoding="utf-8")
          assert "releases/download/v1.6.1" in version.read_text(encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.js index.html android/source-1.6.1
          if ! git diff --cached --quiet; then
            git commit -m "Publier source et informations de la version 1.6.1"
            git pull --rebase
            git push
          fi
