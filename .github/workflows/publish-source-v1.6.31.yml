          set -euo pipefail
          rm -rf android/source-1.6.6 android/source-1.6.7 android/source-1.6.8 android/source-1.6.9 android/source-1.6.10 android/source-1.6.11 android/source-1.6.12 android/source-1.6.13 android/source-1.6.14 android/source-1.6.15 android/source-1.6.16 android/source-1.6.17 android/source-1.6.18 android/source-1.6.19 android/source-1.6.20 android/source-1.6.21 android/source-1.6.22 android/source-1.6.23 android/source-1.6.24 android/source-1.6.25 android/source-1.6.26 android/source-1.6.27 android/source-1.6.28 android/source-1.6.29 android/source-1.6.30 android/source-1.6.31
          cp -R android/source-1.6.5 android/source-1.6.6
          python3 android/patches/auto-invite-v1.6.6.py
          cp -R android/source-1.6.6 android/source-1.6.7
          python3 android/patches/encrypt-share-v1.6.7.py
