name: Publier les sources Android v1.6.31
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/source-publication-trigger-v1.6.31.txt'
permissions:
  contents: write
jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Préparer les sources 1.6.31 à partir de 1.6.5
