          grep -q 'summary-report-month' android/source-1.6.31/app/src/main/assets/index.html
          grep -q 'shared-manual-import' android/source-1.6.31/app/src/main/assets/index.html
          grep -q 'friendsOverviewSyncFinished' android/source-1.6.31/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'last-friends-sync-v1' android/source-1.6.31/app/src/main/assets/index.html
          grep -q 'last-release-check-v1' android/source-1.6.31/app/src/main/assets/index.html
          grep -q 'personal-reminder-card' android/source-1.6.31/app/src/main/assets/index.html
          grep -q 'portrait-add-shared' android/source-1.6.31/app/src/main/assets/index.html
          grep -q 'setPersonalReminder' android/source-1.6.31/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'configurePersonal' android/source-1.6.31/app/src/main/java/fr/monevolution/app/ReminderReceiver.java
          grep -q 'add-profile-chooser' android/source-1.6.31/app/src/main/assets/index.html
          grep -q 'versionCode 47' android/source-1.6.31/app/build.gradle
          grep -q 'advanced-weight-panel' android/source-1.6.31/app/src/main/assets/index.html
          grep -q 'loadComparisonProfile' android/source-1.6.31/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'onFriendChartView' android/source-1.6.31/app/src/main/assets/index.html
          grep -Fq 'AES/GCM/NoPadding' android/source-1.6.31/app/src/main/java/fr/monevolution/app/MainActivity.java
      - name: Vérifier et publier uniquement les sources complètes 1.6.31
        run: |
          set -euo pipefail
          test -f android/source-1.6.31/settings.gradle
          test -f android/source-1.6.31/app/build.gradle
          test -f android/source-1.6.31/app/src/main/AndroidManifest.xml
          test -f android/source-1.6.31/app/src/main/java/fr/monevolution/app/MainActivity.java
          test -f android/source-1.6.31/app/src/main/java/fr/monevolution/app/ReminderReceiver.java
          test -f android/source-1.6.31/app/src/main/assets/index.html
          if find android/source-1.6.31 -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.pem' -o -name 'local.properties' \) | grep -q .; then
            echo 'Refus de publier : fichier potentiellement sensible.' >&2
            exit 1
          fi
          # Le projet de base contient des caches Gradle déjà compilés : ne publier que les sources.
          rm -rf android/source-1.6.31/.gradle android/source-1.6.31/app/build
          printf '/.gradle/\n/app/build/\n/local.properties\n*.jks\n*.keystore\n' > android/source-1.6.31/.gitignore
          cat > android/source-1.6.31/README.md <<'EOF'
          # Mon Évolution IMC — sources Android v1.6.31

          Ce dossier contient **l'intégralité des sources Android v1.6.31**,
          reconstruites à partir de `android/source-1.6.5` et des correctifs successifs
          dans `android/patches/`. Elles correspondent à l'APK publié sous
          [v1.6.31](https://github.com/TheDwarfy01/mon-evolution/releases/tag/v1.6.31).

          Point de départ conseillé pour toutes les nouvelles modifications :
          `android/source-1.6.31/`. Ce dossier peut être ouvert directement
          comme projet Android (Gradle). Pour compiler, utiliser JDK 17 et un
          environnement Android SDK avec la plateforme Android 35.

          Ne pas publier de clés de signature, mots de passe, profils privés ou
          fichiers `local.properties`. La signature des APK officiels est gérée
          par les secrets de GitHub Actions, hors de ce dossier.
          EOF
          git add -A android/source-1.6.31
          git add -f android/source-1.6.31/.gitignore
          echo "Fichiers ajoutés :"
          git diff --cached --name-only | tee /tmp/source-files.txt
          test "$(wc -l < /tmp/source-files.txt)" -ge 8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nettoyer et publier uniquement les sources Android v1.6.31"
          git push origin HEAD:main
