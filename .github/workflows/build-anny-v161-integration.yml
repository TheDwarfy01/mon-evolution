      - name: Installer SDK Android
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --install "platforms;android-37.0" "build-tools;36.0.0"
          # Google publishes API 37 as android-37.0; AGP's integer compileSdk
          # may still look for android-37 on some runner images.
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compiler l'application
        working-directory: android/source-1.6.143
        run: |
          set -euo pipefail
          df -h .
          free -h
          # Retry only transient repository/network errors, never hide build errors.
          for attempt in 1 2 3 4; do
            log="$RUNNER_TEMP/imc-gradle-attempt-$attempt.log"
            if gradle --no-daemon --stacktrace --info --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' :app:assembleRelease 2>&1 | tee "$log"; then
              break
            fi
            if [ "$attempt" -eq 4 ] || ! grep -Eiq '429 Too Many Requests|HTTP[^[:cntrl:]]* (502|503|504)( |:)|Read timed out|Connection reset|Connect timed out' "$log"; then
              exit 1
            fi
            delay=$((30 * attempt))
            echo "::warning::Temporary dependency repository failure; retrying in $delay seconds (attempt $attempt/4)"
            sleep "$delay"
          done
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Signer l'APK avec la cle officielle existante
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/mon-evolution.jks
          mkdir -p downloads
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 \
            android/source-1.6.143/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/mon-evolution-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/mon-evolution.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS \
            --out downloads/Mon_Evolution_IMC_v1.6.172.apk /tmp/mon-evolution-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose downloads/Mon_Evolution_IMC_v1.6.172.apk
          rm -f /tmp/mon-evolution.jks
      - name: Conserver l APK signe de validation
        uses: actions/upload-artifact@v4
        with:
          name: Mon_Evolution_IMC_v1.6.172
          path: downloads/Mon_Evolution_IMC_v1.6.172.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publier une version stable installable par dessus IMC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stable direct-download alias: same signed APK bytes, same name for every release.
          cp downloads/Mon_Evolution_IMC_v1.6.172.apk downloads/Mon_Evolution_IMC.apk
          cmp downloads/Mon_Evolution_IMC_v1.6.172.apk downloads/Mon_Evolution_IMC.apk
          if gh release view v1.6.172 >/dev/null 2>&1; then
            gh release upload v1.6.172 downloads/Mon_Evolution_IMC_v1.6.172.apk downloads/Mon_Evolution_IMC.apk --clobber
            gh release edit v1.6.172 --prerelease=false --latest
          else
            gh release create v1.6.172 downloads/Mon_Evolution_IMC_v1.6.172.apk downloads/Mon_Evolution_IMC.apk --target "$GITHUB_SHA" --latest --title "Mon Évolution IMC 1.6.172 — Anny intégré" --notes "Interface conservée. Balayage horizontal : rotation ; vertical : défilement natif ; deux doigts : zoom et déplacement. Bouton de recentrage affiché uniquement après zoom. Cuisses et bas des cuisses renforcés via la morphologie native Anny, mollets et hanches préservés. Rendu et gestes à valider sur smartphone. Lien APK permanent."
          fi
