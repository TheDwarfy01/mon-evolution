name: Anny 0.6.2 - importer les sources locales
on:
  workflow_dispatch:
  push:
    branches: [experiment/anny-v159]
    paths:
      - '.github/workflows/vendor-anny-v159.yml'
permissions:
  contents: write
concurrency:
  group: vendor-anny-v159
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/anny-v159
      - name: Importer une copie immuable du paquet source officiel
        shell: bash
        run: |
          set -euo pipefail
          dest=android/third_party/anny
          mkdir -p "$dest"
          archive="$dest/anny-0.6.2.tar.gz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --proto '=https' 'https://files.pythonhosted.org/packages/2f/8b/e62b5ce45f234d0f8ee07956d7fa3ef831debdb427e50b07128e5281e017/anny-0.6.2.tar.gz' -o "$archive"
          fi
          printf '%s  %s\n' '270ef9ce790a940199f79b66556a11f9b90793e4bbe7ce8242f31442cde4c9ea' "$archive" | sha256sum -c -
          tar -tzf "$archive" > /tmp/anny-files.txt
          grep -q '/src/anny/' /tmp/anny-files.txt
          grep -q '/LICENSE' /tmp/anny-files.txt
          grep -q '/pyproject.toml' /tmp/anny-files.txt
          cat > "$dest/README.md" <<'EOF'
          # Anny 0.6.2 — source locale
          Archive source officielle publiée le 26 octobre 2026.
          Origine : https://pypi.org/project/anny/0.6.2/
          Amont : https://github.com/naver/anny
          SHA-256 : 270ef9ce790a940199f79b66556a11f9b90793e4bbe7ce8242f31442cde4c9ea
          Le code et les ressources distribuées restent dans ce dépôt. Les avis de licence
          restent dans l'archive originale. Ne pas remplacer automatiquement la version.
          Extraire dans un dossier de travail, sans récupérer Anny depuis Internet :
          `tar -xzf android/third_party/anny/anny-0.6.2.tar.gz -C /tmp`.
          Utiliser exclusivement la topologie native Anny; ne pas télécharger les modèles
          SMPL/SMPL-X soumis à des conditions distinctes.
          Les dépendances Python/PyTorch et le port Android ne sont pas inclus dans cette
          étape. L'APK de production devra intégrer les ressources exportées et les calculs
          locaux nécessaires, avec vérification hors réseau.
          EOF
          git add "$dest/README.md"
          git add -f "$archive"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Vendor Anny 0.6.2 official source archive and license notices'
            git push origin HEAD:experiment/anny-v159
          fi
