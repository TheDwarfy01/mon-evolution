          grep -Fq 'ne remplacent pas l’interprétation d’un pédiatre' android/source-1.6.135/app/src/main/assets/index.html
          # Validate WHO -2 and IOTF age-6 girl thresholds numerically,
          # plus correct ordering of zones, so color interpretation is safe.
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('android/source-1.6.135/app/src/main/assets/growth-references.js','utf8');
          const ctx={window:{}};vm.runInNewContext(source,ctx);
          const who=ctx.window.GROWTH_WHO2007;
          const iotf=ctx.window.GROWTH_IOTF2012.filter(r=>r[1]===2);
          const r=who.find(r=>r[0]===75);
          const bottom=r[15]*Math.pow(1+r[14]*r[16]*(-2),1/r[14]);
          const before=iotf.find(r=>r[0]===72),after=iotf.find(r=>r[0]===78);
          const overweight=(before[2]+after[2])/2,obesity=(before[3]+after[3])/2;
          if(!(bottom>12&&bottom<14&&overweight>17&&overweight<18&&obesity>19&&
               obesity<21&&bottom<15.9&&15.9<overweight&&overweight<obesity))
           throw Error('Seuils enfants incompatibles avec la lecture de la courbe');
          NODE
