          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json,hashlib
          f=Path('android/generated/makehuman-studio-v2.zip')
          with ZipFile(f) as z:
              files=set(z.namelist())
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['assetLicense']=='CC0-1.0'
              assert len(manifest['files'])>=15
              assert manifest['files']['base_body_anim.glb']['clips']>=1
              assert manifest['files']['base_body_anim.glb']['skins']>=1
              assert manifest['files']['base_body_anim.glb']['morphs']>=20
              for name,info in manifest['files'].items():
                  assert name in files
                  assert hashlib.sha256(z.read(name)).hexdigest()==info['sha256']
              assert z.testzip() is None
          print('Studio 3D : texture, rig, animation, coiffures, tenues et 15 GLB confirmés')
          PY
