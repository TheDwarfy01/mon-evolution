name: Construire et publier Mon Evolution IMC 1.6.135
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/release-trigger-v1.6.135.txt'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparer la version 1.6.135 depuis les sources communes 1.6.31
        run: |
          set -euo pipefail
          cp -R android/source-1.6.31 android/source-1.6.135
          python3 - <<'PY'
          from pathlib import Path
          app=Path('android/source-1.6.135/app/build.gradle')
          gradle=app.read_text()
          assert "versionCode 47" in gradle and "versionName '1.6.31'" in gradle
          app.write_text(gradle.replace('versionCode 47','versionCode 151').replace("versionName '1.6.31'","versionName '1.6.135'"))
          html=Path('android/source-1.6.135/app/src/main/assets/index.html')
          source=html.read_text()
          assert 'friends-release-status-row' in source
          assert 'update-compact-line' in source
          assert 'Consulter le profil complet' not in source
          assert "remove.textContent='🗑'" in source
          assert 'position:absolute;top:12px;right:12px' in source
          assert '#shared-content{display:none!important}' in source
          assert 'waterSlots=24' in source
          assert 'id="avatar-choose"' in source
          assert 'Choisir une photo</button>' not in source
          assert 'profile-save-icon' in source
          assert 'profile-tools-corner' in source
          assert 'updateEvolutionRank(progress)' in source
          assert 'weight-and-rank' in source
          assert 'backup-options-menu' in source
          assert 'meal-unsaved-hint' in source
          assert 'pdf-preview-btn' in source
          assert 'progressPdfPayload()' in source
          assert 'mealsPdfPayload()' in source
          assert 'previewPdf(String kind,String reportJson)' in Path('android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java').read_text()
          assert 'showPdfPreview(File file)' in Path('android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java').read_text()
          assert 'Rester et enregistrer' in source
          assert 'Quitter sans enregistrer' in source
          assert 'event.stopImmediatePropagation()' in source
          assert "showShareDialog('Récupérer mes profils'" in source
          assert 'margin:12px 0 22px' in source
          assert 'onJsConfirm(WebView view' in Path('android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java').read_text()
          assert 'onJsAlert(WebView view' in Path('android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java').read_text()
          assert 'min-width:0;margin-top:12px' in source
          assert 'rank-name' in source
          assert 'const renderWithRank=render' in source
          assert 'friendPortrait' in source
          assert 'oldSyncFinished' in source
          assert 'about-info-trigger' in source
          assert 'dialog.append(aboutCard)' in source
          assert 'share-avatar-status' in source
          assert 'id="share-avatar"' in source
          assert 'Sauvegarde et synchronisation' in source
          assert 'Dropbox' in source
          assert 'OneDrive' in source
          assert 'healthReferenceGraph(target,p)' in source
          assert 'quality-checks.js' in source
          assert 'MonEvolutionQuality?.isBackupDocument' in source
          assert 'MonEvolutionQuality?.isSharedDocument' in source
          assert 'refreshFriendOverview' in source
          assert 'backupVerificationResult' in source
          assert 'Zoom sur mes mesures' in source
          assert 'Vue globale' in source
          assert 'advanced-point-detail' in source
          assert 'growth-references.js' in source
          assert 'edit-birth' in source
          assert 'measure-height' in source
          assert 'pass.length>=6' in source
          assert '1 majuscule' in source
          assert 'crypt-generate' in source
          assert 'crypt-copy' in source
          assert 'crypt-send' in source
          assert 'share-change-password' in source
          assert 'share-copy-current-password' in source
          assert 'share-send-current-password' in source
          assert 'function showShareDialog' in source
          assert 'yBands:bands' in source
          assert 'Corpulence normale' in source
          assert 'Zone actuelle :' in source
          assert 'adult-health-zones' in source
          assert 'function stepper(target' in source
          assert 'toggleChartOptions(target)' in source
          assert 'share-everyday' in source
          assert 'share-everyday-state' in source
          assert 'backup-check-actions' in source
          assert 'share-password-current-buttons' in source
          assert '📋 Copier le mot de passe</button>' in source
          assert 'flex-direction:column;align-items:stretch;gap:14px' in source
          assert "controls(target,[['Poids',view==='weight'" in source
          assert 'controls(target,options.map(v=>' in source
          assert 'MonEvolutionQuality?.normalWeightRange(p.height)' in source
          assert "stepper(target,'Période affichée'" in source
          assert 'Paramètres avancés · Drive, liens et options' in source
          assert 'share-link-copy' in source and 'share-link-send' in source
          assert 'receivedSyncInfo?.(friend.key)' in source
          assert 'AndroidBackup.updateReceivedPassword(friend.key,pass)' in source
          assert 'if(listOpen)return;' in source
          assert 'window.friendSyncUpdated=' in source
          assert 'receivedLoadEpoch.incrementAndGet()' in Path('android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java').read_text()
          assert 'recordReceivedSync(key,"ok")' in Path('android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java').read_text()
          assert 'J’ai copié ou envoyé le nouveau mot de passe' in source
          assert 'copyCurrentSharePassword' in Path('android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java').read_text()
          assert 'sendCurrentSharePassword' in Path('android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java').read_text()
          assert 'Confirmer le changement' in source
          assert 'icons[level.key]' in source
          assert 'rank-emblem svg' in source
          assert 'const friendPortrait=' in source
          assert '/^data:image\\/jpeg;base64,/' in source
          assert 'GROWTH_WHO2007' in Path('android/source-1.6.135/app/src/main/assets/growth-references.js').read_text()
          assert 'GROWTH_IOTF2012' in Path('android/source-1.6.135/app/src/main/assets/growth-references.js').read_text()
          source=source.replace('1.6.31','1.6.135')
          html.write_text(source)
          PY
          grep -q 'versionCode 151' android/source-1.6.135/app/build.gradle
          grep -q 'friendsOverviewSyncFinished' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'shareAvatarEnabled' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'backupProviderLabel' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'water23' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'Pause hydratation' android/source-1.6.135/app/src/main/java/fr/monevolution/app/ReminderReceiver.java
          grep -q 'PBKDF2WithHmacSHA256' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -Fq 'AES/GCM/NoPadding' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
      - name: Adapter les correctifs de partage parental a la version 1.6.135
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('child-collaboration','child-share-verification','child-share-file-guide'):
              old=Path('android/patches/'+name+'-v1.6.121.py')
              new=Path('android/patches/'+name+'-v1.6.135.py')
              assert old.is_file(), str(old)
              new.write_text(old.read_text(encoding='utf-8').replace('1.6.121','1.6.135'),
                             encoding='utf-8')
          PY
      - name: Adapter les correctifs valides de la version précédente
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('weekly-meal-pdf','fix-meal-photo-replacement','import-weights-only'):
              old=Path('android/patches/'+name+'-v1.6.59.py')
              new=Path('android/patches/'+name+'-v1.6.135.py')
              assert old.exists()
              new.write_text(old.read_text(encoding='utf-8').replace('1.6.59','1.6.135'),encoding='utf-8')
          for name in ('adaptive-advanced-graphs','unified-health-controls',
                       'advanced-cycle-font','two-row-advanced-tabs','reference-two-row'):
              old=Path('android/patches/'+name+'-v1.6.67.py')
              new=Path('android/patches/'+name+'-v1.6.135.py')
              assert old.exists(), str(old)
              new.write_text(old.read_text(encoding='utf-8').replace('1.6.67','1.6.135'),encoding='utf-8')
          for name in ('compare-graph-ux','nav-responsive','smart-weight-import'):
              old=Path('android/patches/'+name+'-v1.6.72.py')
              new=Path('android/patches/'+name+'-v1.6.135.py')
              assert old.exists(), str(old)
              new.write_text(old.read_text(encoding='utf-8').replace('1.6.72','1.6.135'),encoding='utf-8')
          for name in ('home-summary-cleanup','summary-month-all','treatments-profile-graph',
                       'dated-weight-target','mean-weighings','loss-metric-order',
                       'separate-final-intermediate-goals','treatment-interval-schedule'):
              old=Path('android/patches/'+name+'-v1.6.78.py')
              new=Path('android/patches/'+name+'-v1.6.135.py')
              assert old.exists(), str(old)
              new.write_text(old.read_text(encoding='utf-8').replace('1.6.78','1.6.135'),encoding='utf-8')
          old=Path('android/patches/period-and-intermediate-goal-v1.6.79.py')
          new=Path('android/patches/period-and-intermediate-goal-v1.6.135.py')
          assert old.exists()
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.79','1.6.135'),encoding='utf-8')
          old=Path('android/patches/child-profiles-growth-v1.6.80.py')
          new=Path('android/patches/child-profiles-growth-v1.6.135.py')
          assert old.exists(), str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.80','1.6.135'),encoding='utf-8')
          old=Path('android/patches/child-medical-disclaimer-v1.6.81.py')
          new=Path('android/patches/child-medical-disclaimer-v1.6.135.py')
          assert old.exists()
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.81','1.6.135'),encoding='utf-8')
          old=Path('android/patches/intermediate-goal-dated-segment-v1.6.82.py')
          new=Path('android/patches/intermediate-goal-dated-segment-v1.6.135.py')
          assert old.exists(), str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.82','1.6.135'),encoding='utf-8')
          old=Path('android/patches/profile-order-unspecified-sex-v1.6.83.py')
          new=Path('android/patches/profile-order-unspecified-sex-v1.6.135.py')
          assert old.exists(), str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.83','1.6.135'),encoding='utf-8')
          old=Path('android/patches/extend-final-goal-line-v1.6.84.py')
          new=Path('android/patches/extend-final-goal-line-v1.6.135.py')
          assert old.exists(),str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.84','1.6.135'),encoding='utf-8')
          old=Path('android/patches/pinch-axis-all-graphs-v1.6.85.py')
          new=Path('android/patches/pinch-axis-all-graphs-v1.6.135.py')
          assert old.exists(),str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.85','1.6.135'),encoding='utf-8')
          old=Path('android/patches/responsive-analysis-tabs-v1.6.86.py')
          new=Path('android/patches/responsive-analysis-tabs-v1.6.135.py')
          assert old.exists(),str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.86','1.6.135'),encoding='utf-8')
          old=Path('android/patches/live-pinch-sex-labels-v1.6.87.py')
          new=Path('android/patches/live-pinch-sex-labels-v1.6.135.py')
          assert old.exists(),str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.87','1.6.135'),encoding='utf-8')
          old=Path('android/patches/child-bmi-colored-zones-v1.6.88.py')
          new=Path('android/patches/child-bmi-colored-zones-v1.6.135.py')
          assert old.exists(),str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.88','1.6.135'),encoding='utf-8')
          old=Path('android/patches/child-disable-treatment-goal-v1.6.89.py')
          new=Path('android/patches/child-disable-treatment-goal-v1.6.135.py')
          assert old.exists(),str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.89','1.6.135'),encoding='utf-8')
          # Features introduced in 1.6.112 have standalone reusable scripts
          # that are not generated by the historical adaptation steps above.
          for name in (
              'local-ai','profile-avatar-rotate','backup-conflict',
              'body-measurements','header-shortcuts','received-avatar-rotation',
              'shared-photos-quick','nav-readable','status-topbar',
              'reference-layout','align-header-actions',
          ):
              previous=Path('android/patches/'+name+'-v1.6.112.py')
              current=Path('android/patches/'+name+'-v1.6.135.py')
              assert previous.exists(),str(previous)
              current.write_text(
                  previous.read_text(encoding='utf-8').replace('1.6.112','1.6.135'),
                  encoding='utf-8'
              )
              if name=='reference-layout':
                  replacement=current.read_text(encoding='utf-8')
                  assert 'recolor(pixels,state)' in replacement
                  assert 'f.arms.some' in replacement
                  replacement=replacement.replace('recolor(pixels,state)','tintMaskedPart(ctx,masks[kind]')
                  replacement=replacement.replace('f.arms.some','maskSources()')
                  current.write_text(replacement,encoding='utf-8')
          PY
      - name: Ajouter le bilan hebdomadaire A4 paysage à deux pages
        run: |
          set -euo pipefail
          python3 android/patches/weekly-meal-pdf-v1.6.135.py
          grep -q 'WEEKLY_MEALS_PDF' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'weekly-meal-report' android/source-1.6.135/app/src/main/assets/index.html
          grep -q 'drawWeeklyMealPhoto' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'createWeeklyMealsPdf(output,reportJson)' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
      - name: Corriger le remplacement et la suppression des photos des repas
        run: |
          set -euo pipefail
          python3 android/patches/fix-meal-photo-replacement-v1.6.135.py
          grep -q 'photoPickerBusy' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'meal-photo-recovery' android/source-1.6.135/app/src/main/assets/index.html
          grep -q 'Remplacer la photo du' android/source-1.6.135/app/src/main/assets/index.html
      - name: Importation ciblée sans modification des autres données
        run: |
          set -euo pipefail
          python3 android/patches/import-weights-only-v1.6.135.py
          grep -q 'importWeightsOnlyBase64' android/source-1.6.135/app/src/main/assets/index.html
          grep -q 'IMPORT_WEIGHTS' android/source-1.6.135/app/src/main/java/fr/monevolution/app/MainActivity.java
      - name: Périodes dynamiques et zoom des graphiques avancés
        run: |
          set -euo pipefail
          python3 android/patches/adaptive-advanced-graphs-v1.6.135.py
          grep -Fq 'availablePeriods(p)' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'Afficher les zones de santé (poids / IMC)' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'touchZoom:true' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'Échelle complète' android/source-1.6.135/app/src/main/assets/index.html
      - name: Unifier les commandes de santé et séparer l'analyse
        run: |
          set -euo pipefail
          python3 android/patches/unified-health-controls-v1.6.135.py
          grep -Fq "mon-evolution-health-zones-changed" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "Analyse détaillée" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "['Références',view==='health'" android/source-1.6.135/app/src/main/assets/index.html
          ! grep -Fq "checkbox('Afficher les zones de santé" android/source-1.6.135/app/src/main/assets/index.html
      - name: Simplifier la periode du graphe avance et agrandir les boutons
        run: |
          set -euo pipefail
          python3 android/patches/advanced-cycle-font-v1.6.135.py
          grep -Fq "advanced-period-cycle" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "periodButton=button(" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "mon-evolution-readable-buttons-165" android/source-1.6.135/app/src/main/assets/index.html
          ! grep -Fq "stepper(target,'Période affichée'" android/source-1.6.135/app/src/main/assets/index.html
      - name: Deux lignes de boutons pour les analyses detaillees
        run: |
          set -euo pipefail
          python3 android/patches/two-row-advanced-tabs-v1.6.135.py
          grep -Fq "advancedTabs.classList.add('advanced-view-tabs')" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "target.insertBefore(zoomRow,periodRow)" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "grid-template-columns:repeat(4,minmax(0,1fr))" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "advanced-zoom-row" android/source-1.6.135/app/src/main/assets/index.html
      - name: Deux rangées compactes dans les références
        run: |
          set -euo pipefail
          python3 android/patches/reference-two-row-v1.6.135.py
          grep -Fq "advanced-reference-toolbar" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "advancedTabs.style.setProperty('display','grid','important')" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "target.insertBefore(combined,advancedTabs.nextSibling)" android/source-1.6.135/app/src/main/assets/index.html
      - name: Intégrer statistiques, projection, historique et graphiques
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          page=Path("android/source-1.6.135/app/src/main/assets/index.html")
          source=page.read_text(encoding="utf-8")
          assert source.count("</body></html>")==1
          addon=Path("android/patches/evolution-graph-ux-v1.6.64.html.txt").read_text(encoding="utf-8")
          page.write_text(source.replace("</body></html>",addon+"\n</body></html>"),encoding="utf-8")
          assert "evo-v159-summary" in page.read_text()
          assert "evo-v159-graph" in page.read_text()
          assert "pinchBegin(event)" in page.read_text()
          assert "evo-v160-zones" in page.read_text()
          assert "availablePeriodsForRows(r)" in page.read_text()
          assert "periodChoice='month'" in page.read_text()
          assert "grid-template-columns:repeat(3,minmax(0,1fr))" in page.read_text()
          assert "evo-v164-toggle" in page.read_text()
          assert "Mois" in page.read_text()
          assert "healthState.enabled" in page.read_text()
          assert "mon-evolution-health-zones-changed" in page.read_text()
          PY
      - name: Simplifier tendances et projections selon les pesées réelles
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old=Path('android/patches/simplify-trend-projection-v1.6.69.py')
          new=Path('android/patches/simplify-trend-projection-v1.6.135.py')
          assert old.exists(), str(old)
          new.write_text(old.read_text(encoding='utf-8').replace('1.6.69','1.6.135'),encoding='utf-8')
          PY
          python3 android/patches/simplify-trend-projection-v1.6.135.py
          grep -Fq 'advanced-real-weekly' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'forecastReady=p.rows.length>=4&&historySpan>=21' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'Fiabilité indicative de la projection' android/source-1.6.135/app/src/main/assets/index.html
          ! grep -Fq 'Fourchette de scénarios (0,25 à 1 kg/semaine)' android/source-1.6.135/app/src/main/assets/index.html
          ! grep -Fq 'Repère (kg/semaine)' android/source-1.6.135/app/src/main/assets/index.html
      - name: Ameliorer l ergonomie des comparaisons de profils
        run: |
          set -euo pipefail
          python3 android/patches/compare-graph-ux-v1.6.135.py
          grep -Fq 'compare-metric-grid' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'compare-zoom-row' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'compare-svg' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'comparisonPeriod' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'comparisonPinch' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'compare-legend' android/source-1.6.135/app/src/main/assets/index.html
      - name: Corriger la barre de navigation sur tous les smartphones
        run: |
          set -euo pipefail
          python3 android/patches/nav-responsive-v1.6.135.py
          grep -Fq 'mon-evolution-nav-responsive-172' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'nav.classList.add' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'nav-tab-icon' android/source-1.6.135/app/src/main/assets/index.html
      - name: Import JSON de pesées depuis le chargement classique
        run: |
          set -euo pipefail
          python3 android/patches/smart-weight-import-v1.6.135.py
          grep -Fq "mon-evolution-smart-json-172" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "window.importWeightsOnlyBase64(base64)" android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq "previousRestore.call(this,base64)" android/source-1.6.135/app/src/main/assets/index.html
      - name: Simplifier la carte Poids actuel
        run: |
          set -euo pipefail
          python3 android/patches/home-summary-cleanup-v1.6.135.py
          grep -Fq 'mon-evolution-summary-cleanup-178' android/source-1.6.135/app/src/main/assets/index.html
          grep -Fq 'balance.append(lost,remaining)' android/source-1.6.135/app/src/main/assets/index.html
      - name: Afficher la perte du mois et sélectionner Tout par défaut
