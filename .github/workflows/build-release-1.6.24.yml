name: Construire Mon Evolution IMC 1.6.24 (correctif profils partages)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/release-trigger-v1.6.24.txt'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Préparer les sources 1.6.24 à partir de 1.6.5
        run: |
          set -euo pipefail
          rm -rf android/source-1.6.6 android/source-1.6.7 android/source-1.6.8 android/source-1.6.9 android/source-1.6.10 android/source-1.6.11 android/source-1.6.12 android/source-1.6.13 android/source-1.6.14 android/source-1.6.15 android/source-1.6.16 android/source-1.6.17 android/source-1.6.18 android/source-1.6.19 android/source-1.6.20 android/source-1.6.21 android/source-1.6.22 android/source-1.6.23 android/source-1.6.24
          cp -R android/source-1.6.5 android/source-1.6.6
          python3 android/patches/auto-invite-v1.6.6.py
          cp -R android/source-1.6.6 android/source-1.6.7
          python3 android/patches/encrypt-share-v1.6.7.py
          cp -R android/source-1.6.7 android/source-1.6.8
          python3 android/patches/pin-six-digits-v1.6.8.py
          python3 android/patches/received-summary-v1.6.8.py
          cp -R android/source-1.6.8 android/source-1.6.9
          python3 android/patches/friends-overview-v1.6.9.py
          cp -R android/source-1.6.9 android/source-1.6.10
          python3 android/patches/camera-and-drive-v1.6.10.py
          cp -R android/source-1.6.10 android/source-1.6.11
          python3 android/patches/samsung-camera-v1.6.11.py
          cp -R android/source-1.6.11 android/source-1.6.12
          python3 android/patches/meal-photo-width-v1.6.12.py
          cp -R android/source-1.6.12 android/source-1.6.13
          python3 android/patches/meal-photo-size-v1.6.13.py
          cp -R android/source-1.6.13 android/source-1.6.14
          python3 android/patches/meal-photo-preview-v1.6.14.py
          cp -R android/source-1.6.14 android/source-1.6.15
          python3 android/patches/high-quality-camera-v1.6.15.py
          cp -R android/source-1.6.15 android/source-1.6.16
          python3 android/patches/received-tab-navigation-v1.6.16.py
          cp -R android/source-1.6.16 android/source-1.6.17
          python3 android/patches/friend-meal-calendar-v1.6.17.py
          cp -R android/source-1.6.17 android/source-1.6.18
          python3 android/patches/remove-received-from-list-v1.6.18.py
          cp -R android/source-1.6.18 android/source-1.6.19
          python3 android/patches/profile-avatar-switcher-v1.6.19.py
          cp -R android/source-1.6.19 android/source-1.6.20
          python3 android/patches/advanced-weight-graphs-v1.6.20.py
          cp -R android/source-1.6.20 android/source-1.6.21
          python3 android/patches/compact-profile-actions-v1.6.21.py
          cp -R android/source-1.6.21 android/source-1.6.22
          python3 android/patches/move-share-to-shared-v1.6.22.py
          cp -R android/source-1.6.22 android/source-1.6.23
          python3 android/patches/auto-sync-friends-on-start-v1.6.23.py
          cp -R android/source-1.6.23 android/source-1.6.24
          python3 android/patches/compact-summary-v1.6.24.py
          grep -q 'PHOTO_CAMERA' android/source-1.6.24/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'height:210px' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'friend-view-active' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'has-friend-meals' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'Retirer ce partage' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'renderFriendMealCalendar' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'CameraPhotoProvider' android/source-1.6.24/app/src/main/AndroidManifest.xml
          grep -q '1000f' android/source-1.6.24/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'sharedSyncNeedsPassword' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'Mes amis' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'refreshFriendsOverview' android/source-1.6.24/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'profile-portrait-choice' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'receivedAvatar' android/source-1.6.24/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'profile-tools-toggle' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'Options Google Drive' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'outgoing-share-wrapper' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'outgoing-advanced' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'syncReceivedOnLaunch' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'refreshFriendsOverview' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'brand-hello' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'header-greeting' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'versionCode 40' android/source-1.6.24/app/build.gradle
          grep -q 'advanced-weight-panel' android/source-1.6.24/app/src/main/assets/index.html
          grep -q 'loadComparisonProfile' android/source-1.6.24/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'onFriendChartView' android/source-1.6.24/app/src/main/assets/index.html
          grep -Fq 'AES/GCM/NoPadding' android/source-1.6.24/app/src/main/java/fr/monevolution/app/MainActivity.java
      - name: Tests de non-régression (données et partage)
        run: |
          set -euo pipefail
          sed 's/source-1.6.4/source-1.6.24/g;s/1\.6\.4/1.6.24/g;s/versionCode 20/versionCode 40/g;s/loadSharedPublic?\./loadSharedPublicPassword?./g' android/tests/validate-1.6.4.py > /tmp/validate-1.6.24.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/validate-1.6.24.py')
          s=p.read_text()
          s=s.replace('assert "window.AndroidBackup.openShared()" in html', 'assert "openSharedPassword" in html')
          p.write_text(s)
          PY
          python3 /tmp/validate-1.6.24.py
          grep -q 'PBKDF2WithHmacSHA256' android/source-1.6.24/app/src/main/java/fr/monevolution/app/MainActivity.java
          grep -q 'mon-evolution-chiffre' android/source-1.6.24/app/src/main/java/fr/monevolution/app/MainActivity.java
      - name: Installer SDK Android
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compiler l'application
        working-directory: android/source-1.6.24
        run: gradle --no-daemon :app:assembleRelease
      - name: Signer l'APK avec la clé existante
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/mon-evolution.jks
          mkdir -p downloads
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
            android/source-1.6.24/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/mon-evolution-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/mon-evolution.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS \
            --out downloads/Mon_Evolution_IMC_v1.6.24.apk /tmp/mon-evolution-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose downloads/Mon_Evolution_IMC_v1.6.24.apk
          rm -f /tmp/mon-evolution.jks
      - name: Publier la version 1.6.24
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.6.24 downloads/Mon_Evolution_IMC_v1.6.24.apk \
            --title "Mon Évolution IMC 1.6.24 — correction des profils partagés" \
            --notes "Résumé compact : Bonjour dans le bandeau Mon Évolution, suppression du titre et de la photo en double, cartes et espacements optimisés pour afficher les données sans défilement sur la plupart des téléphones. Synchronisation automatique des amis conservée. Rafraîchissement en arrière-plan, en conservant les anciennes données si Drive inaccessible. Interface et partage de la version précédente conservés. Gestion du profil et sauvegarde privée inchangées. Graphiques avancés et fonctionnalités précédentes conservés. Calendrier partagé et navigation en lecture seule conservés. Correction caméra Samsung conservée. Correctif Drive 1.6.10 conservé. Liste des amis conservée. Code de partage à dix caractères et chiffrement AES-256-GCM conservés. Lecture des anciens partages conservée. Lien inchangé et données privées préservées. Profils personnels, suivi, sauvegardes et partage en lecture seule conservés. Installer par-dessus la 1.6.9."
